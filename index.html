<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Field Route Manifest — Agency Visit Planner</title>

<!-- Home screen icon + standalone-app behavior (iOS + Android) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<meta name="theme-color" content="#0F1F4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Route Manifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#0F1F4D;
    --ink-soft:#3B4C86;
    --paper:#F2F4FA;
    --paper-raised:#FFFFFF;
    --line:#DCE1EF;
    --line-strong:#B7C0DE;
    --route:#7A4FE0;
    --route-soft:#EDE6FB;
    --route-dark:#5A34B8;
    --visited:#C98A1B;
    --visited-soft:#F6E7C9;
    --pending:#B23B3B;
    --pending-soft:#F5DEDC;
    --virtual:#3D6FB4;
    --virtual-soft:#DCE6F4;
    --phone:#1E8A82;
    --phone-soft:#DCEFEC;
    --muted:#5C6690;
    --navy:#0F1F4D;
    --lightblue:#9FD8F0;
    --cream:#F0EAD8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1080px;margin:0 auto;padding:0 20px 60px;transition:max-width .15s ease;}
  #app.map-active{max-width:1700px;}

  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:26px 24px 20px;margin:0 -20px 0;background:var(--navy);
    border-radius:0 0 22px 22px;color:#fff;
  }
  .brand-mark{display:flex;flex-direction:column;gap:2px;}
  .brand-mark .wordmark{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;
    letter-spacing:-0.01em;color:#fff;line-height:1;
    border-bottom:4px solid var(--route);display:inline-block;padding-bottom:4px;width:fit-content;
  }
  .brand-mark .tagline{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:#fff;margin-top:8px;
  }
  .topbar .sub{font-size:12px;color:#C7CEEE;margin-top:4px;font-family:'IBM Plex Mono',monospace;}
  .year-pill{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#C7CEEE;text-align:right;}
  .brand-strip{
    height:10px;margin:0 -20px 4px;border-radius:0 0 4px 4px;overflow:hidden;
    display:flex;
  }
  .brand-strip span{flex:1;height:100%;}

  .tabs{display:flex;gap:6px;margin:18px 0 22px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;
    padding:9px 16px;border-radius:999px 999px 0 0;border:2px solid var(--ink);
    border-bottom:none;background:var(--paper-raised);color:var(--ink-soft);
    cursor:pointer;position:relative;top:2px;
  }
  .tab-btn.active{background:var(--ink);color:#fff;}
  .tab-btn .count{
    font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:11px;
    margin-left:6px;opacity:0.7;
  }

  .card{
    background:var(--paper-raised);border:1.5px solid var(--line-strong);
    border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
  }
  .card-flat{
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}

  input[type=text],input[type=tel],input[type=date],select,textarea{
    font-family:'Public Sans',sans-serif;font-size:13.5px;padding:8px 10px;
    border:1.5px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--route);outline-offset:1px;}
  label{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:4px;}
  .field{display:flex;flex-direction:column;gap:2px;}

  button{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
    padding:8px 14px;border-radius:7px;border:1.5px solid var(--ink);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  button:hover{background:var(--paper);}
  button.primary{background:var(--route);color:#fff;border-color:var(--route-dark);}
  button.primary:hover{background:var(--route-dark);}
  button.ghost{border-color:transparent;background:transparent;padding:6px 8px;}
  button.ghost:hover{background:var(--paper);}
  button.danger{border-color:var(--pending);color:var(--pending);background:#fff;}
  button.danger:hover{background:var(--pending-soft);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button.sm{padding:5px 10px;font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    padding:6px 8px;border-bottom:1.5px solid var(--ink);
  }
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:var(--paper);}
  .addr{color:var(--ink-soft);font-size:12.5px;}
  .agency-name{font-weight:600;}

  .stamp{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
    border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    font-weight:600;border:1.3px solid transparent;white-space:nowrap;
  }
  .stamp.visited-in-person{background:var(--visited-soft);color:#7A5510;border-color:var(--visited);}
  .stamp.visited-virtual{background:var(--virtual-soft);color:#28477A;border-color:var(--virtual);}
  .stamp.visited-phone{background:var(--phone-soft);color:#4C3778;border-color:var(--phone);}
  .stamp.pending{background:var(--pending-soft);color:#7A2626;border-color:var(--pending);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.visited-in-person{background:var(--visited);}
  .dot.visited-virtual{background:var(--virtual);}
  .dot.visited-phone{background:var(--phone);}
  .dot.pending{background:var(--pending);}

  .empty{
    border:1.5px dashed var(--line-strong);border-radius:var(--radius);
    padding:32px 20px;text-align:center;color:var(--muted);
  }
  .empty .empty-title{font-family:'Space Grotesk',sans-serif;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:4px;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(23,36,46,.45);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:#fff;border-radius:12px;border:1.5px solid var(--ink);
    padding:22px 24px;max-width:460px;width:100%;max-height:88vh;overflow:auto;
  }
  .modal h3{font-size:16px;margin-bottom:14px;}
  .modal .field{margin-bottom:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .route-card{
    border:1.5px solid var(--line-strong);border-radius:var(--radius);
    background:var(--paper-raised);padding:16px 18px;margin-bottom:14px;
    border-left:5px solid var(--route);
  }
  .route-card-completed{border-left-color:var(--visited);opacity:0.75;}
  .route-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .route-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;}
  .day-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;
    background:var(--route-soft);color:var(--route-dark);padding:3px 9px;border-radius:999px;
    letter-spacing:.03em;font-weight:600;
  }

  .calendar-card{
    border:1.5px solid var(--line-strong);border-radius:var(--radius);
    background:var(--paper-raised);padding:16px;
  }
  .calendar-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .calendar-month-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .calendar-weekday-row{margin-bottom:8px;}
  .calendar-weekday{
    text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;
    text-transform:uppercase;color:var(--muted);letter-spacing:.04em;
  }
  .calendar-cell{
    position:relative;min-height:140px;border:1.5px solid var(--line);border-radius:8px;
    background:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
    padding:8px 6px;cursor:pointer;gap:4px;overflow:hidden;text-align:left;
  }
  .calendar-cell:hover{border-color:var(--route);}
  .calendar-cell-muted{color:var(--muted);background:var(--paper);}
  .calendar-cell-today{border-color:var(--ink);border-width:2px;}
  .calendar-cell-selected{background:var(--route-soft);border-color:var(--route);border-width:2px;}
  .calendar-daynum{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .calendar-agency-preview{width:100%;}
  .calendar-agency-line{
    font-size:10.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:var(--ink-soft);width:100%;
  }
  .calendar-agency-done{color:var(--muted);text-decoration:line-through;}
  .calendar-agency-more{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .calendar-mobile-count{
    display:none;position:absolute;top:6px;right:6px;background:var(--route);color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;border-radius:999px;
    min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px;
  }
  .stop-list{list-style:none;margin:12px 0 0;padding:0;}
  .stop-item{
    display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);
  }
  .stop-num{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
    width:20px;flex-shrink:0;
  }
  .stop-body{flex:1;min-width:0;}
  .stop-name{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;}
  .stop-addr{font-size:12px;color:var(--muted);overflow-wrap:anywhere;}
  .drag-handle{cursor:grab;color:var(--muted);padding:0 4px;}
  .stop-item.dragging{opacity:.4;}
  .time-chip{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    background:var(--route-soft);color:var(--route-dark);padding:3px 8px;border-radius:6px;white-space:nowrap;
  }
  .drive-seg{
    list-style:none;padding:4px 0 4px 30px;font-size:12px;color:var(--muted);
    border-top:none;display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  }
  .home-leg{padding-left:0;background:var(--paper);border-radius:8px;padding:8px 10px;margin:2px 0;}
  .home-leg-label{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;color:var(--ink-soft);
  }

  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .metric{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .metric .label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;}
  .metric .value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:4px;}
  .progress-track{height:10px;border-radius:999px;background:var(--pending-soft);overflow:hidden;display:flex;margin-top:8px;}
  .progress-seg{height:100%;}

  .month-bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px;}
  .month-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .month-bar{width:100%;background:var(--route);border-radius:3px 3px 0 0;min-height:2px;}
  .month-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;
    font-size:13px;font-family:'Public Sans',sans-serif;z-index:100;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .search-input{min-width:220px;flex:1;}
  .import-zone{
    border:1.5px dashed var(--line-strong);border-radius:var(--radius);
    padding:16px;text-align:center;color:var(--muted);font-size:12.5px;
  }
  .checkbox-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);}
  .checkbox-row input{width:15px;height:15px;}
  .agency-picker{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:0 10px;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;margin:18px 0 8px;}
  .link-btn{background:none;border:none;color:var(--route);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
  .banner{
    background:var(--route-soft);border:1px solid var(--route);border-radius:8px;
    padding:10px 14px;font-size:12.5px;color:var(--route-dark);margin-bottom:16px;
  }
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  .rep-gate{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .rep-gate-inner{background:var(--paper-raised);border:1.5px solid var(--line-strong);border-radius:16px;padding:32px 28px;max-width:380px;width:100%;}
  .rep-gate-inner .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;border-bottom:4px solid var(--route);display:inline-block;padding-bottom:2px;}
  .rep-gate-inner .tagline{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .rep-list{display:flex;flex-direction:column;gap:8px;}
  .rep-card{
    text-align:left;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line-strong);
    background:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
  }
  .rep-card:hover{background:var(--route-soft);border-color:var(--route);}
  .owner-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--paper);
    color:var(--muted);padding:2px 7px;border-radius:999px;border:1px solid var(--line-strong);white-space:nowrap;
  }
  .scope-toggle{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;}
  .scope-toggle button{border:none;border-radius:0;padding:7px 14px;}
  .scope-toggle button.active{background:var(--ink);color:#fff;}
  .map-box{
    width:100%;height:70vh;min-height:440px;max-height:800px;border-radius:var(--radius);border:1.5px solid var(--line-strong);
    background:var(--paper-raised);
  }
  .leaflet-popup-content{margin:10px 12px;}

  .map-layout{display:flex;gap:14px;align-items:flex-start;}
  .map-main{flex:1;min-width:0;}
  .map-preview-panel{
    width:300px;flex-shrink:0;height:70vh;min-height:440px;max-height:800px;display:flex;flex-direction:column;
    border:1.5px solid var(--line-strong);border-radius:var(--radius);background:var(--paper-raised);overflow:hidden;
  }
  .map-preview-header{
    display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
    border-bottom:1.5px solid var(--line);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
    flex-shrink:0;
  }
  .map-preview-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .map-preview-item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .map-preview-item:hover{background:var(--paper);}
  .map-preview-item-active{background:var(--route-soft);border-left:3px solid var(--route);}
  .map-preview-date{
    font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;
    color:var(--muted);letter-spacing:.03em;margin-bottom:3px;display:flex;align-items:center;gap:5px;
  }
  .map-preview-route-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;margin-bottom:3px;}

  .stale-banner{
    background:var(--pending-soft);border:1.5px solid var(--pending);border-radius:8px;
    padding:10px 14px;margin-bottom:16px;font-size:13px;color:#7A2626;
  }
  .stale-list{list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px solid rgba(178,59,59,.3);max-height:220px;overflow:auto;}
  .stale-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;}
  .stale-list li .addr{color:#8a4444;}

  @media (max-width:640px){
    #app{padding:0 12px 40px;}
    .topbar{flex-direction:column;align-items:flex-start;gap:10px;padding:20px 16px 16px;margin:0 -12px 0;}
    .brand-strip{margin:0 -12px 4px;}
    .brand-mark .wordmark{font-size:26px;}
    .brand-mark .tagline{font-size:16px;}
    .year-pill{text-align:left;}
    .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
    .tab-btn{flex-shrink:0;}
    .card,.route-card{padding:14px;}
    table{font-size:12px;}
    th,td{padding:7px 5px;}
    .modal{padding:18px;max-width:94vw;}
    .metric-grid{grid-template-columns:repeat(2,1fr);}
    button{min-height:38px;}
    .row-between{align-items:stretch;}
    .search-input{min-width:0;width:100%;}
    .stop-item{flex-wrap:wrap;}
    .stop-item .stop-body{flex:1 1 100%;order:1;}
    .stop-item .drag-handle,.stop-item .stop-num{order:0;}
    .stop-item select,.stop-item button{order:2;}
    .drive-seg{padding-left:4px;}
    .map-box{height:380px;min-height:0;max-height:none;}
    .map-layout{flex-direction:column;align-items:stretch;}
    .map-preview-panel{width:100%;height:220px;min-height:0;max-height:none;}
    .calendar-cell{min-height:44px;padding:6px;}
    .calendar-daynum{font-size:13px;}
    .calendar-month-label{font-size:15px;}
    .calendar-agency-preview{display:none;}
    .calendar-mobile-count{display:inline-block;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
// ---------- state ----------
const state = {
  tab: 'agencies',
  agencies: [],
  routes: [],
  visits: [],
  reps: [],
  currentRepId: null,
  agencyViewScope: 'mine', // 'mine' | 'all'
  mapViewScope: 'mine', // 'mine' | 'all'
  mapBuildMode: false,
  mapSelectedIds: [],
  mapHighlightedRouteId: null,
  mapProvider: 'leaflet', // 'leaflet' | 'google' — set at render time based on whether a Google Maps key is configured
  repGateStep: 'pick', // 'pick' | 'pin' | 'new'
  repGateSelectedId: null,
  settings: { staleDays: 30 },
  editingRouteId: null,
  agencySearch: '',
  dashboardYear: new Date().getFullYear(),
  calendarYear: new Date().getFullYear(),
  calendarMonth: new Date().getMonth(), // 0-11
  calendarSelectedDate: toDateStr(new Date()),
  loaded: false,
  syncStatus: 'unconfigured', // unconfigured | connected | error | syncing
  lastSyncedAt: null,
  staleBannerOpen: false,
  driveTimeCache: {} // routeId -> { computing: bool, segments: [{minutes, miles}], error: bool }
};

function repById(id){ return state.reps.find(r => r.id === id); }
function currentRep(){ return repById(state.currentRepId); }
function myAgencies(){ return state.agencies.filter(a => a.ownerId === state.currentRepId); }
function getRememberedRepId(){
  try{ return localStorage.getItem('avp_current_rep') || null; }catch(e){ return null; }
}
function rememberRepId(id){
  try{ if(id) localStorage.setItem('avp_current_rep', id); else localStorage.removeItem('avp_current_rep'); }catch(e){}
}

const WEEKDAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const VISIT_TYPES = [
  {id:'in-person', label:'In person', color:'visited-in-person'},
  {id:'virtual', label:'Virtual', color:'visited-virtual'},
  {id:'phone', label:'Phone call', color:'visited-phone'}
];
const TIME_OPTIONS = (function(){
  const out = [];
  for(let h=0; h<24; h++){
    for(let m=0; m<60; m+=15){
      const hh = String(h).padStart(2,'0');
      const mm = String(m).padStart(2,'0');
      const ampm = h===0 ? '12:'+mm+' AM' : h<12 ? h+':'+mm+' AM' : h===12 ? '12:'+mm+' PM' : (h-12)+':'+mm+' PM';
      out.push({ value: hh+':'+mm, label: ampm });
    }
  }
  return out;
})();

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

// ---------- storage ----------
// Data is cached in this browser's localStorage (works instantly, per-device)
// and mirrored to a Google Sheet via a small Apps Script endpoint (works across devices).
// See Settings tab to connect the endpoint.
function getEndpoint(){
  try{ return localStorage.getItem('avp_endpoint') || ''; }catch(e){ return ''; }
}
function setEndpoint(url){
  try{ localStorage.setItem('avp_endpoint', url); }catch(e){}
}
function localGet(key){
  try{ const v = localStorage.getItem('avp_'+key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
function localSet(key, value){
  try{ localStorage.setItem('avp_'+key, JSON.stringify(value)); }catch(e){}
}

async function remoteGet(key){
  const endpoint = getEndpoint();
  if(!endpoint) return null;
  const res = await fetch(endpoint + '?key=' + encodeURIComponent(key), { method:'GET' });
  if(!res.ok) throw new Error('Bad response');
  const data = await res.json();
  return data.value != null ? JSON.parse(data.value) : null;
}
async function remoteSet(key, value){
  const endpoint = getEndpoint();
  if(!endpoint) return false;
  const res = await fetch(endpoint, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // text/plain avoids a CORS preflight Apps Script can't answer
    body: JSON.stringify({ key, value: JSON.stringify(value) })
  });
  if(!res.ok) throw new Error('Bad response');
  return true;
}

async function loadState(){
  const endpoint = getEndpoint();
  const keys = ['agencies','routes','visits','settings','reps'];
  if(endpoint){
    state.syncStatus = 'syncing';
    try{
      const [a, r, v, st, rp] = await Promise.all(keys.map(remoteGet));
      state.agencies = a || [];
      state.routes = r || [];
      state.visits = v || [];
      state.settings = st || { staleDays: 30 };
      state.reps = rp || [];
      keys.forEach(k => localSet(k, state[k]));
      state.syncStatus = 'connected';
      state.lastSyncedAt = new Date();
    }catch(e){
      state.agencies = localGet('agencies') || [];
      state.routes = localGet('routes') || [];
      state.visits = localGet('visits') || [];
      state.settings = localGet('settings') || { staleDays: 30 };
      state.reps = localGet('reps') || [];
      state.syncStatus = 'error';
    }
  } else {
    state.agencies = localGet('agencies') || [];
    state.routes = localGet('routes') || [];
    state.visits = localGet('visits') || [];
    state.settings = localGet('settings') || { staleDays: 30 };
    state.reps = localGet('reps') || [];
    state.syncStatus = 'unconfigured';
  }
  migrateRouteStops();
  const remembered = getRememberedRepId();
  if(remembered && repById(remembered)) state.currentRepId = remembered;
  state.loaded = true;
  render();
}

// Older saved routes stored `agencyIds: [id, id, ...]`. Newer routes store
// `stops: [{agencyId, time}, ...]` so each stop can carry a scheduled time.
function migrateRouteStops(){
  let changed = false;
  state.routes.forEach(r => {
    if(!r.stops && Array.isArray(r.agencyIds)){
      r.stops = r.agencyIds.map(id => ({ agencyId:id, time:'' }));
      delete r.agencyIds;
      changed = true;
    }
    if(!r.stops) r.stops = [];
  });
  if(changed) saveRoutes();
}

async function persist(key, value){
  localSet(key, value); // always save locally first so nothing is ever lost
  const endpoint = getEndpoint();
  if(!endpoint){ render(); return; }
  try{
    await remoteSet(key, value);
    state.syncStatus = 'connected';
    state.lastSyncedAt = new Date();
  }catch(e){
    state.syncStatus = 'error';
    showToast('Saved on this device — could not reach shared storage');
  }
  render();
}
const saveAgencies = () => persist('agencies', state.agencies);
const saveRoutes = () => persist('routes', state.routes);
const saveVisits = () => persist('visits', state.visits);
const saveReps = () => persist('reps', state.reps);
const saveSettings = () => persist('settings', state.settings);

async function syncNow(){
  if(!getEndpoint()){ showToast('Add your Apps Script URL first'); return; }
  state.syncStatus = 'syncing'; render();
  try{
    await Promise.all([
      remoteSet('agencies', state.agencies),
      remoteSet('routes', state.routes),
      remoteSet('visits', state.visits),
      remoteSet('settings', state.settings)
    ]);
    state.syncStatus = 'connected';
    state.lastSyncedAt = new Date();
    showToast('Synced');
  }catch(e){
    state.syncStatus = 'error';
    showToast('Could not reach shared storage — check the URL and your connection');

}

function showToast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  setTimeout(()=>{ root.innerHTML=''; }, 2600);
}


function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- derived helpers ----------
function agencyById(id){ return state.agencies.find(a => a.id === id); }

function visitsForAgencyYear(agencyId, year){
  return state.visits.filter(v => v.agencyId === agencyId && new Date(v.date).getFullYear() === year);
}
function lastVisit(agencyId){
  const vs = state.visits.filter(v => v.agencyId === agencyId).sort((a,b)=> new Date(b.date)-new Date(a.date));
  return vs[0] || null;
}
function yearStats(year){
  const mine = myAgencies();
  const total = mine.length;
  const myIds = new Set(mine.map(a=>a.id));
  const visitedIds = new Set(state.visits.filter(v => myIds.has(v.agencyId) && new Date(v.date).getFullYear() === year).map(v=>v.agencyId));
  const visitedCount = visitedIds.size;
  const pct = total ? Math.round((visitedCount/total)*1000)/10 : 0;
  const byType = {'in-person':0,'virtual':0,'phone':0};
  state.visits.filter(v => myIds.has(v.agencyId) && new Date(v.date).getFullYear() === year).forEach(v => { byType[v.type] = (byType[v.type]||0)+1; });
  return { total, visitedCount, pct, byType, visitedIds };
}

function staleAgencies(){
  const days = state.settings.staleDays || 30;
  const cutoff = Date.now() - days*24*60*60*1000;
  return myAgencies().filter(a => {
    const lv = lastVisit(a.id);
    return !lv || new Date(lv.date).getTime() < cutoff;
  }).sort((a,b) => {
    const la = lastVisit(a.id), lb = lastVisit(b.id);
    const ta = la ? new Date(la.date).getTime() : -Infinity;
    const tb = lb ? new Date(lb.date).getTime() : -Infinity;
    return ta - tb;
  });
}

// ---------- CSV import ----------
function normalizeHeader(h){ return h.toLowerCase().replace(/[^a-z]/g,''); }
function mapRow(row){
  const out = {name:'', address:'', principal:'', phone:''};
  Object.keys(row).forEach(key => {
    const nk = normalizeHeader(key);
    const val = (row[key]||'').toString().trim();
    if(!val) return;
    if(['name','agency','agencyname','organization','org'].includes(nk)) out.name = val;
    else if(['address','addr','location','street','fulladdress'].includes(nk)) out.address = val;
    else if(['principal','principalname','director','contact','contactname'].includes(nk)) out.principal = val;
    else if(['phone','phonenumber','telephone','tel','number'].includes(nk)) out.phone = val;
  });
  return out;
}
function handleCsvFile(file){
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: function(results){
      let added = 0, skipped = 0;
      results.data.forEach(row => {
        const m = mapRow(row);
        if(!m.name || !m.address){ skipped++; return; }
        state.agencies.push({ id: uid(), name:m.name, address:m.address, principal:m.principal, phone:m.phone, ownerId: state.currentRepId, createdAt: new Date().toISOString() });
        added++;
      });
      saveAgencies();
      showToast(added + ' agencies imported' + (skipped ? ', ' + skipped + ' rows skipped (missing name/address)' : ''));
      render();
    },
    error: function(){ showToast('Could not read that file — check it is a CSV.'); }
  });
}

// ---------- map export helpers ----------
function appleMapsUrlSingle(address){

}
function appleMapsUrlMultiStop(addresses){

function googleMapsUrlMultiStop(addresses){

// ---------- geocoding + drive time estimates ----------
// Uses free public services (OpenStreetMap Nominatim for geocoding, OSRM's demo
// router for driving time). No API key needed, but these are best-effort/rate-limited
// public services meant for light personal use — not a paid, guaranteed-uptime API.
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

async function geocodeAddress(address){
  const attempt = async (q, retriesLeft) => {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    let res;
    try{
      res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), {
        headers: { 'Accept':'application/json' }, signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }
    if(res.status === 429){
      if(retriesLeft <= 0) throw new Error('rate limited');
      await sleep(2000);
      return attempt(q, retriesLeft - 1);
    }
    if(!res.ok) throw new Error('geocode failed');
    const data = await res.json();
    if(!data || !data[0]) return null;
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  };
  // First try the address as entered (max 2 retries on rate-limit responses).
  let loc = await attempt(address, 2);
  if(loc) return loc;
  // Fall back to a simplified version — suite/unit numbers are the most common
  // reason a full-service geocoder can't find an otherwise-valid address.
  const simplified = address
    .replace(/,?\s*(suite|ste|unit|apt|#)\s*[\w-]+/gi, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
  if(simplified && simplified !== address){
    await sleep(1100);
    loc = await attempt(simplified, 2);
    if(loc) return loc;
  }
  throw new Error('no match');
}

async function ensureGeocoded(agency){
  if(agency.lat != null && agency.lon != null) return true; // includes manually-entered coordinates
  try{
    const loc = await geocodeAddress(agency.address);
    agency.lat = loc.lat;
    agency.lon = loc.lon;
    delete agency.geocodeFailed;
    return true;
  }catch(e){
    agency.geocodeFailed = true;
    return false;
  }
}

async function ensureHomeGeocoded(){
  const addr = (state.settings.homeAddress || '').trim();
  if(!addr) return null;
  if(state.settings.homeLat != null && state.settings.homeLon != null){
    return { lat: state.settings.homeLat, lon: state.settings.homeLon };
  }
  try{
    const loc = await geocodeAddress(addr);
    state.settings.homeLat = loc.lat;
    state.settings.homeLon = loc.lon;
    saveSettings();
    return loc;
  }catch(e){
    return null;
  }
}

async function driveSegment(from, to){
  const attempt = async () => {
    const url = 'https://router.project-osrm.org/route/v1/driving/'+from.lon+','+from.lat+';'+to.lon+','+to.lat+'?overview=false';
    const res = await fetch(url);
    if(!res.ok) throw new Error('routing failed');
    const data = await res.json();
    if(!data.routes || !data.routes[0]) throw new Error('no route');
    return { minutes: Math.round(data.routes[0].duration/60), miles: Math.round(data.routes[0].distance/160.9344)/10 };
  };
  try{
    return await attempt();
  }catch(e){
    await sleep(1200); // the free OSRM demo server occasionally hiccups — one retry clears most of these
    return await attempt();
  }
}

// If a Google Maps API key is set in Settings, drive times are estimated with
// Google's Distance Matrix Service instead — it takes addresses directly (no
// separate geocoding step to fail) and reflects Google's own road data.
let googleMapsLoading = null;
function loadGoogleMaps(apiKey){
  if(window.google && window.google.maps) return Promise.resolve();
  if(googleMapsLoading) return googleMapsLoading;
  googleMapsLoading = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(apiKey) + '&libraries=places';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Google Maps failed to load — check the API key'));
    document.head.appendChild(script);
  });
  return googleMapsLoading;
}
async function estimateDriveTimesGoogle(routeId, apiKey){
  const r = state.routes.find(x=>x.id===routeId);
  const agencies = r.stops.map(s => agencyById(s.agencyId)).filter(Boolean);
  await loadGoogleMaps(apiKey);
  const service = new google.maps.DistanceMatrixService();
  const homeAddr = (state.settings.homeAddress || '').trim();

  const singleLeg = async (fromAddr, toAddr) => {
    const result = await new Promise((resolve, reject) => {
      service.getDistanceMatrix({
        origins:[fromAddr], destinations:[toAddr],
        travelMode: google.maps.TravelMode.DRIVING,
        drivingOptions:{ departureTime: new Date(), trafficModel:'bestguess' }
      }, (res, status) => status === 'OK' ? resolve(res) : reject(new Error(status)));
    });
    const el = result.rows[0].elements[0];
    if(el.status !== 'OK') throw new Error(el.status);
    return { minutes: Math.round(el.duration.value/60), miles: Math.round(el.distance.value/160.9344)/10 };
  };

  const segments = [];
  let anyError = false;
  for(let i=0; i<agencies.length-1; i++){
    try{ segments.push(await singleLeg(agencies[i].address, agencies[i+1].address)); }
    catch(e){ segments.push(null); anyError = true; }
  }

  let homeLeg = null, returnLeg = null, homeError = false;
  if(homeAddr && agencies.length){
    try{ homeLeg = await singleLeg(homeAddr, agencies[0].address); }catch(e){ homeError = true; }
    try{ returnLeg = await singleLeg(agencies[agencies.length-1].address, homeAddr); }catch(e){ homeError = true; }
  }

  state.driveTimeCache[routeId] = { computing:false, segments, homeLeg, returnLeg, error:anyError||homeError, homeError, source:'google' };
  render();
}

async function estimateDriveTimes(routeId){
  const r = state.routes.find(x=>x.id===routeId);
  if(!r || r.stops.length < 1) return;
  state.driveTimeCache[routeId] = { computing:true, segments:[], error:false };
  render();

  const googleKey = state.settings.googleMapsApiKey;
  if(googleKey){
    try{
      await estimateDriveTimesGoogle(routeId, googleKey);
      return;
    }catch(e){
      showToast('Google Maps estimate failed — falling back to free routing');
    }
  }

  const agencies = r.stops.map(s => agencyById(s.agencyId)).filter(Boolean);
  const failedNames = [];
  for(let i=0; i<agencies.length; i++){
    if(agencies[i].lat == null || agencies[i].lon == null){
      const ok = await ensureGeocoded(agencies[i]);
      if(!ok) failedNames.push(agencies[i].name);
      await sleep(1100); // respect Nominatim's ~1 request/second usage policy
    }
  }
  saveAgencies();
  const segments = [];
  let routingFailed = false;
  for(let i=0; i<agencies.length-1; i++){
    const from = agencies[i], to = agencies[i+1];
    if(from.lat==null || to.lat==null){ segments.push(null); continue; }
    try{
      segments.push(await driveSegment(from, to));
    }catch(e){
      segments.push(null);
      routingFailed = true;
    }
    await sleep(400);
  }

  let homeLeg = null, returnLeg = null, homeError = false;
  const homeAddr = (state.settings.homeAddress || '').trim();
  if(homeAddr && agencies.length){
    const home = await ensureHomeGeocoded();
    if(!home){
      homeError = true;
    } else {
      const first = agencies[0], last = agencies[agencies.length-1];
      if(first.lat!=null){
        try{ await sleep(400); homeLeg = await driveSegment(home, first); }catch(e){ homeError = true; }
      }
      if(last.lat!=null){
        try{ await sleep(400); returnLeg = await driveSegment(last, home); }catch(e){ homeError = true; }
      }
    }
  }

  state.driveTimeCache[routeId] = { computing:false, segments, homeLeg, returnLeg, error: failedNames.length>0 || routingFailed || homeError, failedNames, homeError, source:'free' };
  render();
}

// ---------- route order optimization ----------
// Builds a full travel-time matrix in as few requests as possible, then
// reorders stops to minimize total drive time — any stop with a scheduled
// time is treated as a fixed checkpoint the route must hit in that order;
// stops without a time get slotted in wherever adds the least extra driving.
async function getDurationMatrixOSRM(agencies){
  const coords = agencies.map(a => a.lon+','+a.lat).join(';');
  const url = 'https://router.project-osrm.org/table/v1/driving/'+coords+'?annotations=duration';
  const res = await fetch(url);
  if(!res.ok) throw new Error('matrix request failed');
  const data = await res.json();
  if(!data.durations) throw new Error('no matrix in response');
  return data.durations.map(row => row.map(sec => sec==null ? Infinity : sec/60));
}

async function getDurationMatrixGoogle(agencies, apiKey){
  await loadGoogleMaps(apiKey);
  const service = new google.maps.DistanceMatrixService();
  const addresses = agencies.map(a => a.address);
  const result = await new Promise((resolve, reject) => {
    service.getDistanceMatrix({
      origins: addresses, destinations: addresses,
      travelMode: google.maps.TravelMode.DRIVING,
      drivingOptions:{ departureTime: new Date(), trafficModel:'bestguess' }
    }, (res, status) => status === 'OK' ? resolve(res) : reject(new Error(status)));
  });
  return result.rows.map(row => row.elements.map(el => el.status==='OK' ? el.duration.value/60 : Infinity));
}

function routeLength(order, matrix){
  let total = 0;
  for(let i=0;i<order.length-1;i++) total += matrix[order[i]][order[i+1]];
  return total;
}

// Nearest-neighbor construction, then 2-opt local search — a standard,
// well-understood approach to this kind of ordering problem.
function nearestNeighborOrder(startIdx, indices, matrix){
  const remaining = new Set(indices);
  remaining.delete(startIdx);
  const order = [startIdx];
  let current = startIdx;
  while(remaining.size){
    let best = null, bestDist = Infinity;
    remaining.forEach(idx => {
      const d = matrix[current][idx];
      if(d < bestDist){ bestDist = d; best = idx; }
    });
    order.push(best);
    remaining.delete(best);
    current = best;
  }
  return order;
}
function twoOptImprove(order, matrix){
  let improved = true;
  let guard = 0;
  while(improved && guard < 200){
    improved = false;
    guard++;
    for(let i=1; i<order.length-2; i++){
      for(let j=i+1; j<order.length-1; j++){
        const a=order[i-1], b=order[i], c=order[j], d=order[j+1];
        const before = matrix[a][b] + matrix[c][d];
        const after = matrix[a][c] + matrix[b][d];
        if(after + 0.01 < before){
          const seg = order.slice(i, j+1).reverse();
          order = order.slice(0,i).concat(seg, order.slice(j+1));
          improved = true;
        }
      }
    }
  }
  return order;
}

// Cheapest-insertion: slot each unscheduled stop into whichever gap in the
// fixed (time-anchored) sequence adds the least extra driving time.
function cheapestInsertionOrder(fixedIndices, freeIndices, matrix){
  let order = fixedIndices.slice();
  freeIndices.forEach(idx => {
    let bestPos = 0, bestExtra = Infinity;
    for(let pos=0; pos<=order.length; pos++){
      const prev = pos>0 ? order[pos-1] : null;
      const next = pos<order.length ? order[pos] : null;
      let extra;
      if(prev==null) extra = matrix[idx][next];
      else if(next==null) extra = matrix[prev][idx];
      else extra = matrix[prev][idx] + matrix[idx][next] - matrix[prev][next];
      if(extra < bestExtra){ bestExtra = extra; bestPos = pos; }
    }
    order.splice(bestPos, 0, idx);
  });
  return order;
}

async function optimizeRouteOrder(routeId){
  const r = state.routes.find(x=>x.id===routeId);
  if(!r || r.stops.length < 3){ showToast('Add at least 3 stops to optimize an order'); return; }
  state.driveTimeCache[routeId] = { computing:true, segments:[], error:false };
  render();

  const agencies = r.stops.map(s => agencyById(s.agencyId)).filter(Boolean);
  const googleKey = state.settings.googleMapsApiKey;
  const homeAddr = (state.settings.homeAddress || '').trim();
  let home = null;
  if(homeAddr) home = await ensureHomeGeocoded();
  const matrixAgencies = agencies.slice();
  let homeIdx = null;
  if(home){
    homeIdx = matrixAgencies.length;
    matrixAgencies.push({ lat: home.lat, lon: home.lon, address: homeAddr });
  }

  let matrix;
  try{
    if(googleKey){
      matrix = await getDurationMatrixGoogle(matrixAgencies, googleKey);
    } else {
      const missing = agencies.filter(a => a.lat==null || a.lon==null);
      for(let i=0;i<missing.length;i++){ await ensureGeocoded(missing[i]); await sleep(1100); }
      saveAgencies();
      if(agencies.some(a=>a.lat==null||a.lon==null)) throw new Error('some stops could not be located');
      matrix = await getDurationMatrixOSRM(matrixAgencies);
    }
  }catch(e){
    state.driveTimeCache[routeId] = { computing:false, segments:[], error:true, failedNames: agencies.filter(a=>a.lat==null||a.lon==null).map(a=>a.name) };
    render();
    showToast('Couldn\u2019t optimize — could not build a travel-time matrix for these stops');
    return;
  }

  const indices = agencies.map((a,i)=>i);
  const timed = r.stops.map((s,i)=>({i, time:s.time})).filter(x=>x.time);
  let orderIdx;
  if(timed.length >= 1){
    const fixedIdx = timed.sort((a,b)=>a.time.localeCompare(b.time)).map(x=>x.i);
    if(homeIdx != null) fixedIdx.unshift(homeIdx); // day starts from home before the first appointment
    const freeIdx = indices.filter(i => !fixedIdx.includes(i));
    let fullOrder = cheapestInsertionOrder(fixedIdx, freeIdx, matrix);
    if(homeIdx != null) fullOrder = fullOrder.filter(i => i !== homeIdx);
    orderIdx = fullOrder;
  } else {
    const startIdx = homeIdx != null ? homeIdx : 0;
    const searchIndices = homeIdx != null ? indices.concat([homeIdx]) : indices;
    let fullOrder = nearestNeighborOrder(startIdx, searchIndices, matrix);
    if(homeIdx != null) fullOrder = fullOrder.filter(i => i !== homeIdx);
    orderIdx = twoOptImprove(fullOrder, matrix);
  }

  r.stops = orderIdx.map(i => r.stops[i]);
  saveRoutes();
  showToast('Route order optimized'+(home ? ' around your starting address' : ''));
  await estimateDriveTimes(routeId); // refresh leg-by-leg times to match the new order
}

// ---------- rendering ----------
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = '<div style="padding:60px 0;text-align:center;color:var(--muted)">Loading manifest…</div>'; return; }
  if(!currentRep()){ app.innerHTML = renderRepGate(); attachGlobalListeners(); return; }
  app.classList.toggle('map-active', state.tab === 'map' && state.editingRouteId === null);
  app.innerHTML = renderTopbar() + renderTabs() + renderStaleBanner() + renderBody();
  attachGlobalListeners();
}

function renderStaleBanner(){
  const stale = staleAgencies();
  if(stale.length === 0) return '';
  const days = state.settings.staleDays || 30;
  let html = '<div class="stale-banner">'+
    '<div class="row-between" data-action="toggle-stale-banner" style="cursor:pointer;">'+
      '<div class="row" style="gap:8px;">'+
        '<span class="dot pending"></span>'+
        '<b>'+stale.length+' agenc'+(stale.length===1?'y':'ies')+'</b>&nbsp;overdue for a visit (no contact in '+days+'+ days)'+
      '</div>'+
      '<button class="ghost sm" data-action="toggle-stale-banner">'+(state.staleBannerOpen?'Hide':'Show')+'</button>'+
    '</div>';
  if(state.staleBannerOpen){
    html += '<ul class="stale-list">';
    stale.slice(0,25).forEach(a => {
      const lv = lastVisit(a.id);
      html += '<li><span>'+escapeHtml(a.name)+'</span>'+
        '<span class="addr">'+(lv ? 'last visited '+new Date(lv.date).toLocaleDateString() : 'never visited')+'</span>'+
        '<button class="ghost sm" data-action="mark-visited" data-id="'+a.id+'">Log visit</button>'+
      '</li>';
    });
    if(stale.length > 25) html += '<li class="addr">+ '+(stale.length-25)+' more — see the Agencies tab.</li>';
    html += '</ul>';
  }
  html += '</div>';
  return html;
}

      '<div class="field"><label>Choose a PIN (4+ digits)</label><input type="text" inputmode="numeric" id="rep-pin-new-input" style="width:100%;" placeholder="e.g. 1234"></div>'+

function renderTabs(){
  const tabs = [
    {id:'agencies', label:'Agencies', count: state.agencyViewScope==='all' ? state.agencies.length : myAgencies().length},
    {id:'routes', label:'Routes', count: state.routes.filter(r=>r.ownerId===state.currentRepId).length},
    {id:'map', label:'Map', count: null},
    {id:'dashboard', label:'Coverage', count: null},
    {id:'settings', label:'Settings', count: null}
  ];
  return '<div class="tabs">' + tabs.map(t =>
    '<button class="tab-btn '+(state.tab===t.id?'active':'')+'" data-action="set-tab" data-tab="'+t.id+'">'+
      t.label + (t.count!=null ? '<span class="count">'+t.count+'</span>' : '') +
    '</button>'
  ).join('') + '</div>';
}

function renderBody(){
  if(state.editingRouteId !== null) return renderRouteEditor();
  if(state.tab === 'agencies') return renderAgenciesTab();
  if(state.tab === 'routes') return renderRoutesTab();
  if(state.tab === 'map') return renderMapTab();
  if(state.tab === 'dashboard') return renderDashboardTab();
  if(state.tab === 'settings') return renderSettingsTab();
  return '';
}

// ---- Agencies tab ----

  const list = base.filter(a =>
    !q || a.name.toLowerCase().includes(q) || a.address.toLowerCase().includes(q) || (a.principal||'').toLowerCase().includes(q)
  ).sort((a,b)=>a.name.localeCompare(b.name));

  let html = '<div class="card-flat" style="padding:16px 18px;margin-bottom:16px;">'+
    '<div class="row-between">'+
      '<div class="row">'+
        '<input class="search-input" type="text" id="agency-search" placeholder="Search agencies by name, address, or principal" value="'+escapeHtml(state.agencySearch)+'">'+
        '<div class="scope-toggle">'+
          '<button class="'+(scope==='mine'?'active':'')+'" data-action="set-agency-scope" data-scope="mine">My agencies</button>'+

    '</div>'+

  '</div>';

  if(list.length === 0){
    html += '<div class="empty"><div class="empty-title">'+(scope==='all'?'No agencies on file yet':'No agencies in your list yet')+'</div>'+
      'Add one manually or import a CSV to get your list started.</div>';

  }

  html += '<div class="table-scroll"><table><thead><tr><th>Agency</th><th>Principal</th><th>Phone</th><th>Last visit</th>'+(scope==='all'?'<th>Rep</th>':'')+'<th></th></tr></thead><tbody>';

      '<td class="mono">'+escapeHtml(a.phone||'—')+'</td>'+

// ---- Routes tab ----
function renderRoutesTab(){
  const myRoutes = state.routes.filter(r => r.ownerId === state.currentRepId);
  const year = state.calendarYear, month = state.calendarMonth;
  const monthLabel = new Date(year, month, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const todayStr = toDateStr(new Date());
  const selectedStr = state.calendarSelectedDate;

  const routesByDate = {};
  myRoutes.forEach(r => { if(r.date) (routesByDate[r.date] = routesByDate[r.date]||[]).push(r); });

  const weeks = buildCalendarGrid(year, month);
  let html = '<div class="row-between" style="margin-bottom:14px;">'+
    '<div class="addr">Click a date to see the routes assigned to it.</div>'+
  '</div>';

  html += '<div class="calendar-card">'+
    '<div class="calendar-nav">'+
      '<button class="ghost sm" data-action="calendar-prev-month">&larr;</button>'+
      '<div class="calendar-month-label">'+monthLabel+'</div>'+
      '<button class="ghost sm" data-action="calendar-next-month">&rarr;</button>'+
      '<button class="ghost sm" data-action="calendar-today" style="margin-left:auto;">Today</button>'+
    '</div>'+
    '<div class="calendar-grid calendar-weekday-row">'+
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="calendar-weekday">'+d+'</div>').join('')+
    '</div>';

  weeks.forEach(week => {
    html += '<div class="calendar-grid">';
    week.forEach(date => {
      const dStr = toDateStr(date);
      const inMonth = date.getMonth() === month;
      const dayRoutes = routesByDate[dStr] || [];
      const stopsPreview = [];
      dayRoutes.forEach(r => {
        r.stops.forEach(s => {
          const a = agencyById(s.agencyId);
          if(a) stopsPreview.push({ name:a.name, completed: !!r.completed });
        });
      });
      const shown = stopsPreview.slice(0,5);
      const extra = stopsPreview.length - shown.length;
      html += '<div class="calendar-cell'+
          (inMonth?'':' calendar-cell-muted')+
          (dStr===selectedStr?' calendar-cell-selected':'')+
          (dStr===todayStr?' calendar-cell-today':'')+
        '" data-action="select-calendar-date" data-date="'+dStr+'">'+
        '<span class="calendar-daynum">'+date.getDate()+'</span>'+
        (stopsPreview.length ? '<span class="calendar-mobile-count">'+stopsPreview.length+'</span>' : '')+
        (stopsPreview.length ? '<div class="calendar-agency-preview">'+
          shown.map(s=>'<div class="calendar-agency-line'+(s.completed?' calendar-agency-done':'')+'">'+escapeHtml(s.name)+'</div>').join('')+
          (extra>0 ? '<div class="calendar-agency-more">+'+extra+' more</div>' : '')+
        '</div>' : '')+
      '</div>';
    });
    html += '</div>';
  });
  html += '</div>';

  const selectedDate = new Date(selectedStr+'T00:00:00');
  const selectedLabel = selectedDate.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  const selectedRoutes = (routesByDate[selectedStr] || []);

  html += '<div class="row-between" style="margin:20px 0 10px;">'+
    '<div class="section-label" style="margin:0;">Routes for '+selectedLabel+'</div>'+
    '<button class="primary sm" data-action="new-route-for-date" data-date="'+selectedStr+'">New route for this date</button>'+
  '</div>';

  if(selectedRoutes.length === 0){
    html += '<div class="empty">No routes assigned to this date yet.</div>';
  } else {
    selectedRoutes.forEach(r => { html += renderRouteCard(r); });
  }

  const undated = myRoutes.filter(r => !r.date);
  html += '<div class="row-between" style="margin-top:20px;">'+
    '<div class="section-label" style="margin:0;">Not assigned to a date'+(undated.length?' ('+undated.length+')':'')+'</div>'+
    '<button class="ghost sm" data-action="new-route">+ New route without a date</button>'+
  '</div>';
  if(undated.length){
    undated.forEach(r => { html += renderRouteCard(r); });
  } else {
    html += '<div class="addr" style="margin:6px 0 0;">Handy for a recurring weekly template you\u2019ll assign a date to later.</div>';
  }

  if(myRoutes.length === 0){
    html = '<div class="empty"><div class="empty-title">No routes yet</div>Pick a date on the calendar above, or use "Build a route" on the Map tab.</div>' + html;
  }

  return html;
}

function renderRouteCard(r){
  const stopAgencies = r.stops.map(s => ({ agency: agencyById(s.agencyId), time: s.time })).filter(x => x.agency);
  const year = state.dashboardYear;
  const dt = state.driveTimeCache[r.id];

  let html = '<div class="route-card'+(r.completed?' route-card-completed':'')+'">'+
    '<div class="route-head">'+
      '<div><div class="route-title">'+escapeHtml(r.name)+(r.completed?' <span class="stamp visited-in-person">Completed</span>':'')+'</div>'+
      '<div class="addr">'+stopAgencies.length+' stop'+(stopAgencies.length===1?'':'s')+(r.date ? ' · '+new Date(r.date+'T00:00:00').toLocaleDateString() : '')+'</div></div>'+
      '<div class="row">'+
        '<span class="day-chip">'+escapeHtml(r.day)+'</span>'+
        '<button class="ghost sm" data-action="toggle-route-completed" data-id="'+r.id+'">'+(r.completed?'Reopen':'Mark completed')+'</button>'+
        '<button class="ghost sm" data-action="edit-route" data-id="'+r.id+'">Edit</button>'+
        '<button class="ghost sm" data-action="duplicate-route" data-id="'+r.id+'">Duplicate</button>'+
        '<button class="ghost sm" data-action="delete-route" data-id="'+r.id+'">Delete</button>'+
      '</div>'+
    '</div>';

  if(stopAgencies.length){
    html += '<ul class="stop-list">';
    html += renderHomeLegRow(r, 'start');
    stopAgencies.forEach((s,i) => {
      const a = s.agency;
      const visited = visitsForAgencyYear(a.id, year).length > 0;
      html += '<li class="stop-item">'+
        '<span class="stop-num">'+(i+1)+'.</span>'+
        '<span class="dot '+(visited?'visited-in-person':'pending')+'" title="'+(visited?'Visited this year':'Not visited this year')+'"></span>'+
        '<div class="stop-body"><div class="stop-name">'+escapeHtml(a.name)+'</div><div class="stop-addr">'+escapeHtml(a.address)+'</div></div>'+
        (s.time ? '<span class="time-chip">'+formatTime(s.time)+'</span>' : '')+
        '<button class="ghost sm" data-action="mark-visited" data-id="'+a.id+'">Log</button>'+
      '</li>';
      if(i < stopAgencies.length-1){
        html += '<li class="drive-seg">'+renderDriveSegment(dt, i)+'</li>';
      }
    });
    html += renderHomeLegRow(r, 'end');
    html += '</ul>';

    if(stopAgencies.length > 1 || (state.settings.homeAddress||'').trim()){
      html += '<div class="row" style="margin-top:10px;">'+
        '<button class="ghost sm" data-action="estimate-drive" data-id="'+r.id+'" '+(dt&&dt.computing?'disabled':'')+'>'+
          (dt&&dt.computing ? 'Estimating…' : 'Estimate drive times') +
        '</button>'+
        (dt && dt.error ? '<span class="addr">'+driveErrorMessage(dt)+'</span>' : '')+
      '</div>';
    }

    const addresses = stopAgencies.map(s=>s.agency.address);
    html += '<div class="row" style="margin-top:10px;">'+
      '<button class="primary" data-action="export-apple" data-id="'+r.id+'">Open route in Apple Maps</button>'+
      '<button data-action="export-google" data-id="'+r.id+'">Open route in Google Maps</button>'+
      '<button class="ghost" data-action="copy-stops" data-id="'+r.id+'">Copy stop list</button>'+
    '</div>';
    if(stopAgencies.length > 8){
      html += '<div class="addr" style="margin-top:6px;">Long routes may exceed the URL length a map app allows — if the link fails to open, use "Copy stop list" and paste the stops into your maps app instead.</div>';
    }
  } else {
    html += '<div class="addr" style="margin-top:10px;">No stops assigned yet.</div>';
  }
  html += '</div>';
  return html;
}

function formatTime(hhmm){
  const opt = TIME_OPTIONS.find(t => t.value === hhmm);
  return opt ? opt.label : hhmm;
}

function toDateStr(date){
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function weekdayNameForDateStr(dateStr){
  return WEEKDAYS[(new Date(dateStr+'T00:00:00').getDay()+6)%7]; // getDay() is Sun=0; WEEKDAYS starts Monday
}
// Builds a 6-row grid of Date objects (Sun-Sat columns) covering the given month,
// including the trailing/leading days from adjacent months to fill the grid.
function buildCalendarGrid(year, month){
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0=Sun
  const gridStart = new Date(year, month, 1 - startOffset);
  const weeks = [];
  let cursor = new Date(gridStart);
  for(let w=0; w<6; w++){
    const week = [];
    for(let d=0; d<7; d++){
      week.push(new Date(cursor));
      cursor.setDate(cursor.getDate()+1);
    }
    weeks.push(week);
  }
  return weeks;
}

function renderDriveSegment(dt, index){
  if(!dt || dt.computing) return '<span class="addr">&middot;&middot;&middot;</span>';
  const seg = dt.segments && dt.segments[index];
  if(!seg) return '<span class="addr">drive time unavailable</span>';
  return '<span class="addr">&#8594; ~'+seg.minutes+' min drive ('+seg.miles+' mi)</span>';
}

function driveErrorMessage(dt){
  if(!dt || !dt.error) return '';
  if(dt.failedNames && dt.failedNames.length){
    return 'Couldn\u2019t locate: '+dt.failedNames.map(escapeHtml).join(', ')+
      '. Try a more complete address, or add coordinates manually on that agency\u2019s edit form.';
  }
  if(dt.homeError){
    return 'Couldn\u2019t locate your starting address — check it in Settings, or try a more complete version (street, city, state, zip).';
  }
  return 'Some legs couldn\u2019t be estimated — the free routing service may be temporarily unavailable. Try again in a moment, or add a Google Maps API key in Settings for a more reliable estimate.';
}

        '<span class="drag-handle">::</span>'+
        '<span class="stop-num">'+(i+1)+'.</span>'+

        '<select class="mono" style="font-size:12px;padding:5px 6px;" data-action="set-stop-time" data-index="'+i+'" title="Scheduled meeting time">'+
          '<option value="">No time set</option>'+
          TIME_OPTIONS.map(t=>'<option value="'+t.value+'" '+(stop.time===t.value?'selected':'')+'>'+t.label+'</option>').join('')+
        '</select>'+
        '<button class="ghost sm" data-action="move-stop-up" data-index="'+i+'" '+(i===0?'disabled':'')+'>&uarr;</button>'+
        '<button class="ghost sm" data-action="move-stop-down" data-index="'+i+'" '+(i===r.stops.length-1?'disabled':'')+'>&darr;</button>'+
        '<button class="ghost sm" data-action="remove-stop" data-index="'+i+'">Remove</button>'+
      '</li>';
      if(i < r.stops.length-1){
        html += '<li class="drive-seg">'+renderDriveSegment(dt, i)+leaveByHint(r, i)+'</li>';
      }
    });
    html += renderHomeLegRow(r, 'end');
    html += '</ul>';
    if(dt && dt.error){
      html += '<div class="addr" style="margin-top:6px;">'+driveErrorMessage(dt)+'</div>';
    }
    if(!(state.settings.homeAddress||'').trim()){
      html += '<div class="addr" style="margin-top:6px;">Add a starting/ending address in Settings to also see drive time to your first stop and back at the end of the day.</div>';
    }
    if(r.stops.length > 2){
      html += '<div class="addr" style="margin-top:8px;">"Optimize order" reorders stops to cut total driving time, using real road data — any stop with a scheduled time is kept as a fixed checkpoint and the rest are slotted around it.</div>';
    }
  }
  html += '</div>';

  // agency picker
  html += '<div style="flex:1;min-width:280px;">'+
    '<div class="section-label">Add agencies to this route</div>'+
    '<input type="text" id="route-agency-search" placeholder="Search agencies…" style="width:100%;margin-bottom:8px;">'+
    '<div class="agency-picker" id="route-agency-picker">';
  sorted.forEach(a => {

      '<input type="checkbox" data-action="toggle-stop" data-id="'+a.id+'" '+(assigned.has(a.id)?'checked':'')+'>'+
      '<div><div class="stop-name">'+escapeHtml(a.name)+'</div><div class="stop-addr">'+escapeHtml(a.address)+'</div></div>'+
    '</div>';
  });
  if(sorted.length === 0) html += '<div class="addr" style="padding:12px 0;">No agencies on file yet — add some from the Agencies tab.</div>';
  html += '</div></div>';

  html += '</div>';
  return html;
}

function leaveByLabel(seg, targetTime){
  if(!seg || !targetTime) return '';
  const [hh,mm] = targetTime.split(':').map(Number);
  const arriveBy = new Date(); arriveBy.setHours(hh,mm,0,0);
  const leaveBy = new Date(arriveBy.getTime() - seg.minutes*60000);
  const label = leaveBy.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return ' <span class="addr">&middot; leave by '+label+' to arrive on time</span>';
}
function leaveByHint(r, index){
  const dt = state.driveTimeCache[r.id];
  if(!dt || !dt.segments) return '';
  const nextStop = r.stops[index+1];
  return leaveByLabel(dt.segments[index], nextStop && nextStop.time);
}
function renderHomeLegRow(r, position){
  // position: 'start' (home -> first stop) or 'end' (last stop -> home)
  const homeAddr = (state.settings.homeAddress || '').trim();
  if(!homeAddr) return '';
  const dt = state.driveTimeCache[r.id];
  const label = position === 'start' ? 'Starting point' : 'Return trip';
  let body;
  if(!dt || dt.computing){
    body = '<span class="addr">&middot;&middot;&middot;</span>';
  } else if(position === 'start' && dt.homeLeg){
    body = '<span class="addr">&#8594; ~'+dt.homeLeg.minutes+' min drive ('+dt.homeLeg.miles+' mi)</span>'+leaveByLabel(dt.homeLeg, r.stops[0] && r.stops[0].time);
  } else if(position === 'end' && dt.returnLeg){
    body = '<span class="addr">&#8594; ~'+dt.returnLeg.minutes+' min drive ('+dt.returnLeg.miles+' mi) back</span>';
  } else if(dt.homeError){
    body = '<span class="addr">couldn\u2019t be estimated</span>';
  } else {
    body = '<span class="addr">not yet estimated</span>';
  }
  return '<li class="drive-seg home-leg"><span class="home-leg-label">\uD83C\uDFE0 '+label+' — '+escapeHtml(homeAddr)+'</span> '+body+'</li>';
}

// Resolves which agencies are mappable, geocoding any that are missing
// coordinates, and updates the status line. Shared by both map backends.
async function resolveMapAgencies(statusEl){
  const scope = state.mapViewScope;
  const list = (scope === 'all' ? state.agencies : myAgencies()).filter(a => a.address);
  const missing = list.filter(a => a.lat == null && a.lon == null && !a.geocodeFailed);

  if(missing.length){
    for(let i=0; i<missing.length; i++){
      if(!document.getElementById('agency-map')) return null; // left the tab mid-geocode
      if(statusEl) statusEl.textContent = 'Locating agencies… ('+(i+1)+' of '+missing.length+')';
      await ensureGeocoded(missing[i]);
      await sleep(1100); // respect Nominatim's ~1 request/second usage policy
    }
    saveAgencies();
  }
  if(!document.getElementById('agency-map')) return null;

  const located = list.filter(a => a.lat != null && a.lon != null);
  const unlocated = list.filter(a => a.lat == null || a.lon == null);
  if(statusEl){
    statusEl.innerHTML = unlocated.length
      ? 'Couldn\u2019t place on the map: '+unlocated.map(a=>escapeHtml(a.name)).join(', ')+
        '. Try a more complete address, or add coordinates manually on that agency\u2019s edit form. '+
        '<button class="ghost sm" data-action="retry-map-geocode" style="margin-left:6px;">Retry</button>'
      : '';
  }
  return located;
}

// Shared 24x24 five-point star path, used by both map backends so pin
// shape/color customization looks consistent regardless of which renders.
const STAR_PATH_24 = 'M12 2 L14.9 9.1 L22.5 9.1 L16.3 13.6 L18.5 21 L12 16.5 L5.5 21 L7.7 13.6 L1.5 9.1 L9.1 9.1 Z';

const ROUTE_ASSIGNED_COLOR = '#FFC800';
function hasOpenRouteAssignment(agencyId){
  return state.routes.some(r => !r.completed && r.stops.some(s => s.agencyId === agencyId));
}
function markerColorFor(agency){
  if(agency.markerColor) return agency.markerColor;
  if(hasOpenRouteAssignment(agency.id)) return ROUTE_ASSIGNED_COLOR;
  const visited = visitsForAgencyYear(agency.id, state.dashboardYear).length > 0;
  return visited ? '#C98A1B' : '#B23B3B';
}

function leafletMarkerIcon(shape, color, selected){
  const stroke = selected ? '#7A4FE0' : '#17242E';
  const weight = selected ? 3 : 1.5;
  const inner = shape === 'star'
    ? '<path d="'+STAR_PATH_24+'" fill="'+color+'" stroke="'+stroke+'" stroke-width="'+weight+'" stroke-linejoin="round"/>'
    : '<circle cx="12" cy="12" r="9" fill="'+color+'" stroke="'+stroke+'" stroke-width="'+weight+'"/>';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24">'+inner+'</svg>';
  return L.divIcon({ html: svg, className:'', iconSize:[26,26], iconAnchor:[13,13] });
}

function toggleMapSelection(agencyId){
  const idx = state.mapSelectedIds.indexOf(agencyId);
  if(idx === -1) state.mapSelectedIds.push(agencyId);
  else state.mapSelectedIds.splice(idx, 1);
  const marker = markersByAgencyId[agencyId];
  if(marker) applyMarkerSelectionStyle(marker, agencyId);
  updateRouteBuilderPanel();
}

function applyMarkerSelectionStyle(marker, agencyId){
  const selected = state.mapSelectedIds.includes(agencyId);
  const a = agencyById(agencyId);
  if(!a) return;
  const color = markerColorFor(a);
  if(state.mapProvider === 'google'){
    const icon = marker.getIcon();
    icon.strokeColor = selected ? '#7A4FE0' : '#17242E';
    icon.strokeWeight = selected ? 4 : 1.5;
    marker.setIcon(icon);
  } else {
    marker.setIcon(leafletMarkerIcon(a.markerShape || 'circle', color, selected));
  }
}

// Leaflet + OpenStreetMap — free, no API key. Used automatically unless a
// Google Maps API key is configured in Settings. Loaded lazily so the
// library only downloads for people who actually open the Map tab.
let leafletLoading = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletLoading) return leafletLoading;
  leafletLoading = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Map library failed to load — check your connection'));
    document.head.appendChild(script);
  });
  return leafletLoading;
}

  const statusEl = document.getElementById('map-status');
  const mapEl = document.getElementById('agency-map');
  if(!mapEl) return; // user navigated away before this resolved

  try{
    if(statusEl) statusEl.textContent = 'Loading map…';
    await loadLeaflet();
  }catch(e){
    if(statusEl) statusEl.textContent = 'Could not load the map library — check your connection and reopen this tab.';
    return;
  }

  const located = await resolveMapAgencies(statusEl);
  if(located === null) return;

  try{ if(mapInstance){ mapInstance.remove(); mapInstance = null; } }catch(e){}
  state.mapProvider = 'leaflet';
  if(located.length === 0) return;

  mapInstance = L.map('agency-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(mapInstance);

  const markers = [];
  markersByAgencyId = {};
  located.forEach(a => {
    const color = markerColorFor(a);
    const selected = state.mapBuildMode && state.mapSelectedIds.includes(a.id);
    const marker = L.marker([a.lat, a.lon], {
      icon: leafletMarkerIcon(a.markerShape || 'circle', color, selected)
    }).addTo(mapInstance);
    marker.bindTooltip(escapeHtml(a.name), { direction:'top', offset:[0,-8] });
    marker.bindPopup(markerPopupHtml(a));
    marker.on('click', () => { if(state.mapBuildMode) toggleMapSelection(a.id); });
    markersByAgencyId[a.id] = marker;
    markers.push(marker);
  });

  const highlightedLocated = applyMapHighlight(located);
  const boundsTargets = (highlightedLocated || located).map(a => markersByAgencyId[a.id]).filter(Boolean);
  if(boundsTargets.length === 1){
    mapInstance.setView(boundsTargets[0].getLatLng(), highlightedLocated ? 14 : 13);
  } else if(boundsTargets.length > 1){
    mapInstance.fitBounds(L.featureGroup(boundsTargets).getBounds().pad(0.15));
  }
  if(state.mapBuildMode) updateRouteBuilderPanel();
}

// Dims markers not on the currently-highlighted route (from the map preview
// panel), and returns the highlighted subset so callers can fit bounds to it.
function applyMapHighlight(located){
  const highlighted = state.mapHighlightedRouteId ? state.routes.find(r=>r.id===state.mapHighlightedRouteId) : null;
  if(!highlighted){
    located.forEach(a => { const m = markersByAgencyId[a.id]; if(m) m.setOpacity(1); });
    return null;
  }
  const hSet = new Set(highlighted.stops.map(s=>s.agencyId));
  located.forEach(a => {
    const m = markersByAgencyId[a.id];
    if(m) m.setOpacity(hSet.has(a.id) ? 1 : 0.25);
  });
  const hLocated = located.filter(a => hSet.has(a.id));
  return hLocated.length ? hLocated : null;
}

// Google Maps — used automatically when a Google Maps API key is configured
// in Settings, for the real Google map look, roads, and labels.
let googleMapInstance = null;
let googleInfoWindow = null;
async function initMapViewGoogle(apiKey){
  const statusEl = document.getElementById('map-status');
  const mapEl = document.getElementById('agency-map');
  if(!mapEl) return;

  if(statusEl) statusEl.textContent = 'Loading map…';
  await loadGoogleMaps(apiKey);
  if(!window.google || !google.maps || !google.maps.Map) throw new Error('Google Maps script did not initialize');

  const located = await resolveMapAgencies(statusEl);
  if(located === null) return;

  state.mapProvider = 'google';
  googleMapInstance = new google.maps.Map(mapEl, {
    mapTypeControl:false, streetViewControl:false, fullscreenControl:false
  });
  googleInfoWindow = new google.maps.InfoWindow();
  if(located.length === 0) return;

  const bounds = new google.maps.LatLngBounds();
  markersByAgencyId = {};
  located.forEach(a => {
    const color = markerColorFor(a);
    const selected = state.mapBuildMode && state.mapSelectedIds.includes(a.id);
    const shape = a.markerShape || 'circle';
    const icon = shape === 'star'
      ? {
          path: STAR_PATH_24,
          fillColor: color, fillOpacity: 0.9,
          strokeColor: selected ? '#7A4FE0' : '#17242E', strokeWeight: selected ? 4 : 1.5,
          scale: 1, anchor: new google.maps.Point(12,12)
        }
      : {
          path: google.maps.SymbolPath.CIRCLE,
          fillColor: color, fillOpacity: 0.9,
          strokeColor: selected ? '#7A4FE0' : '#17242E', strokeWeight: selected ? 4 : 1.5,
          scale: 9
        };
    const marker = new google.maps.Marker({
      position: { lat:a.lat, lng:a.lon },
      map: googleMapInstance,
      title: a.name,
      icon: icon
    });
    marker.addListener('click', () => {
      if(state.mapBuildMode) toggleMapSelection(a.id);
      googleInfoWindow.setContent(markerPopupHtml(a));
      googleInfoWindow.open(googleMapInstance, marker);
    });
    markersByAgencyId[a.id] = marker;
    bounds.extend(marker.getPosition());
  });

  const highlightedLocated = applyMapHighlight(located);
  const boundsTargets = (highlightedLocated || located).map(a => markersByAgencyId[a.id]).filter(Boolean);
  if(boundsTargets.length === 1){
    googleMapInstance.setCenter(boundsTargets[0].getPosition());
    googleMapInstance.setZoom(highlightedLocated ? 14 : 13);
  } else if(boundsTargets.length > 1){
    const b = new google.maps.LatLngBounds();
    boundsTargets.forEach(m => b.extend(m.getPosition()));
    googleMapInstance.fitBounds(b, 48);
  }
  if(state.mapBuildMode) updateRouteBuilderPanel();
}

// ---- Dashboard tab ----
function renderDashboardTab(){
  const year = state.dashboardYear;
  const s = yearStats(year);
  const years = [];
  const nowY = new Date().getFullYear();
  for(let y = nowY+1; y >= nowY-4; y--) years.push(y);

  let html = '<div class="row-between" style="margin-bottom:16px;">'+
    '<div class="field"><label>Calendar year</label><select id="dash-year">'+years.map(y=>'<option value="'+y+'" '+(y===year?'selected':'')+'>'+y+'</option>').join('')+'</select></div>'+
  '</div>';

  if(s.total === 0){
    html += '<div class="empty"><div class="empty-title">Nothing to measure yet</div>Add agencies to start tracking coverage.</div>';
    return html;
  }

  html += '<div class="metric-grid">'+
    '<div class="metric"><div class="label">Agencies visited</div><div class="value">'+s.pct+'%</div>'+
      '<div class="progress-track">'+
        '<div class="progress-seg" style="width:'+s.pct+'%;background:var(--visited);"></div>'+
      '</div>'+
      '<div class="addr" style="margin-top:6px;">'+s.visitedCount+' of '+s.total+' agencies reached in '+year+'</div>'+
    '</div>'+
    '<div class="metric"><div class="label">In person</div><div class="value">'+s.byType['in-person']+'</div><div class="addr">visits logged</div></div>'+
    '<div class="metric"><div class="label">Virtual</div><div class="value">'+s.byType['virtual']+'</div><div class="addr">visits logged</div></div>'+
    '<div class="metric"><div class="label">Phone</div><div class="value">'+s.byType['phone']+'</div><div class="addr">visits logged</div></div>'+
  '</div>';

  // month breakdown
  const monthCounts = new Array(12).fill(0);
  state.visits.filter(v => new Date(v.date).getFullYear() === year).forEach(v => {
    monthCounts[new Date(v.date).getMonth()]++;
  });
  const maxM = Math.max(1, ...monthCounts);
  html += '<div class="card">'+
    '<div class="section-label" style="margin-top:0;">Visits by month</div>'+
    '<div class="month-bars">'+
      monthCounts.map((c,i) => {
        const h = Math.round((c/maxM)*100);
        return '<div class="month-bar-wrap"><div class="mono" style="font-size:10px;color:var(--muted);">'+(c||'')+'</div>'+
          '<div class="month-bar" style="height:'+Math.max(h,c>0?4:0)+'%;"></div>'+
          '<div class="month-label">'+['J','F','M','A','M','J','J','A','S','O','N','D'][i]+'</div></div>';
      }).join('')+
    '</div>'+
  '</div>';

  // not yet visited
  const notVisited = myAgencies().filter(a => !s.visitedIds.has(a.id)).sort((a,b)=>a.name.localeCompare(b.name));
  html += '<div class="section-label">Not yet visited in '+year+' ('+notVisited.length+')</div>';
  if(notVisited.length === 0){
    html += '<div class="banner">Every agency on file has been reached in '+year+'.</div>';
  } else {
    html += '<div class="table-scroll"><table><thead><tr><th>Agency</th><th>Principal</th><th>Phone</th><th></th></tr></thead><tbody>';
    notVisited.forEach(a => {
      html += '<tr><td><div class="agency-name">'+escapeHtml(a.name)+'</div><div class="addr">'+escapeHtml(a.address)+'</div></td>'+
        '<td>'+escapeHtml(a.principal||'—')+'</td><td class="mono">'+escapeHtml(a.phone||'—')+'</td>'+
        '<td><button class="ghost sm" data-action="mark-visited" data-id="'+a.id+'">Log visit</button></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  return html;
}
